<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Bon Marché – Fresh • Healthy • Community. สุขภาพดี เริ่มได้ที่นี่" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Noto+Sans+Thai:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <title>Bon Marché | Fresh • Healthy • Community</title>
  </head>
  <body>
    <div id="root"></div>

    <!-- shown when JavaScript is switched off for this site -->
    <noscript>
      <div style="font-family:&quot;Nunito Sans&quot;,&quot;Noto Sans Thai&quot;,sans-serif;max-width:560px;margin:15vh auto;padding:24px;border-radius:16px;background:#eef8f5;color:#0e5d56;text-align:center">
        <h1 style="font-size:22px;margin:0 0 8px">กรุณาเปิด JavaScript</h1>
        <p style="margin:0">เบราว์เซอร์นี้ปิด JavaScript สำหรับเว็บไซต์นี้ไว้ จึงแสดงหน้าเว็บไม่ได้</p>
      </div>
    </noscript>

    <!--
      If the app has not rendered after 8 s (scripts blocked by an extension,
      a browser policy, or stale cached files), show a hint instead of a blank page.
    -->
    <script>
      setTimeout(function () {
        var root = document.getElementById('root')
        if (root && !root.children.length) {
          root.innerHTML =
            '<div style="font-family:&quot;Nunito Sans&quot;,&quot;Noto Sans Thai&quot;,sans-serif;max-width:600px;margin:15vh auto;padding:28px;border-radius:18px;background:#eef8f5;color:#0e5d56;line-height:1.7">' +
            '<h1 style="font-size:22px;margin:0 0 10px">หน้าเว็บโหลดไม่สำเร็จ</h1>' +
            '<p style="margin:0 0 10px">ไฟล์ของเว็บถูกบล็อกหรือโหลดไม่ครบในเบราว์เซอร์นี้ ลองทำตามนี้:</p>' +
            '<ol style="margin:0 0 14px;padding-left:20px">' +
            '<li>กด <b>Ctrl + Shift + R</b> เพื่อโหลดใหม่</li>' +
            '<li>ปิดส่วนขยาย (Extension) ที่บล็อกโฆษณา/สคริปต์ สำหรับเว็บนี้</li>' +
            '<li>ลองเปิดในหน้าต่างไม่ระบุตัวตน (Ctrl + Shift + N)</li>' +
            '</ol>' +
            '<button onclick="location.reload()" style="border:0;border-radius:999px;background:#138377;color:#fff;padding:10px 22px;font:inherit;cursor:pointer">โหลดใหม่</button>' +
            '</div>'
        }
      }, 8000)
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
